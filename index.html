<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
/* ═══════════════════════════════════════════════
   VALORI DA MODIFICARE (tutto qui, niente altro)
   ═══════════════════════════════════════════════ */

/* Nome del sito e titolo della scheda del browser */
const NOME_SITO = "idk-34";
const TITOLO_PAGINA = "Photos";

/* E-mail mostrata nella pagina Contatti (lasciala vuota per non mostrarla) */
const CONTATTI_EMAIL = "";

/* Testo della pagina "Chi sono" */
const CHI_SONO = "";

/* Valori usati per TUTTE le foto (cambia qui, si aggiornano tutte) */
const FOTO_DEFAULT = {
  luogo: "Cagliari",
  camera: "Praktica MTL 5B",
  obiettivo: "Petri C.C Auto 55mm f/1.8, Pentacon auto Multi Coating 50mm f/1.8, MIR-1B (МИР-1В) 37mm f/2.8",
  data: ""
};

/* Elenco delle foto (devono stare nella cartella foto/).
   Scrivi il nome del file, poi uno spazio e una t se la foto deve comparire
   nella schermata "Foto". Senza t si vede solo in Luoghi -> città.
   Esempi:  "IMG_7299.jpg t"  (si vede in Foto e in Luoghi)
            "IMG_7301.jpg"    (si vede solo in Luoghi)                    */
const FOTO_FILE = [
  "IMG_7299.jpg ","IMG_7301.jpg ","IMG_7302.jpg ","IMG_7305.jpg t","IMG_7307.jpg t",
  "IMG_7309.JPG ","IMG_7310.jpg ","IMG_7313.JPG t","IMG_7316.jpg t","IMG_7585.jpg t",
  "IMG_7588.JPG t","IMG_7589.jpg ","IMG_7592.jpg ","IMG_7594.JPG ","IMG_7595.jpg ",
  "IMG_7597.jpg t","IMG_7602.jpg ","IMG_7603.JPG t","IMG_7604.jpg ","IMG_7606.JPG t",
  "IMG_7608.jpg ","IMG_7609.JPG ","IMG_7610.jpg t","IMG_7611.JPG ","IMG_7613.JPG ",
  "IMG_7615.jpg ","IMG_7618.jpg ","IMG_7620.jpg ","IMG_7621.jpg ","IMG_7690.jpg "
];

/* Solo per le foto diverse dal default (opzionale). Esempio:
   "IMG_7299.jpg": {titolo:"Tramonto", luogo:"Roma", data:"2026-05-12", focale:"50mm", apertura:"f/8", tempo:"1/250", iso:"100"}
   (scrivi il nome del file senza la t) */
const FOTO_EXTRA = {
};

/* Pagina "Attrezzatura" */
const ATTREZZATURA = {
  fotocamere: [
    {nome:"Praktica MTL 5B", note:""}
  ],
  obiettivi: [
    // {nome:"Nome obiettivo", note:"Descrizione"}
  ]
};

/* Firebase (stessa configurazione degli altri siti) */
const firebaseConfig = {
  apiKey: "AIzaSyA0-O7pTF_M_DmJ2mkvlGqkJuoD5Lc_WjE",
  authDomain: "workspace-5e87a.firebaseapp.com",
  projectId: "workspace-5e87a"
};

/* ═══════════════════ FINE VALORI ═══════════════════ */
</script>
<title>Photos</title>
<style>
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,sans-serif;background:#fff;color:#111;line-height:1.5}
header{position:sticky;top:0;background:#fff;display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid #eee;z-index:10}
header h1{font-size:20px;font-weight:600;letter-spacing:.5px}
#burger{font-size:26px;background:none;border:0;cursor:pointer;line-height:1}
#menu{position:fixed;top:0;left:-260px;width:260px;height:100%;background:#fff;border-right:1px solid #eee;padding:70px 0 20px;transition:left .25s;z-index:30}
#menu.open{left:0}
#menu a{display:block;padding:14px 24px;color:#111;text-decoration:none;cursor:pointer}
#menu a:hover{background:#f5f5f5}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:20}
#overlay.open{display:block}
main{max-width:1100px;margin:0 auto;padding:24px 16px}
h2{font-weight:600;margin-bottom:18px}
.vuoto{color:#777}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;cursor:pointer;display:block;background:#f2f2f2}
.luoghi{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.luoghi button{padding:8px 16px;border:1px solid #ddd;background:#fff;border-radius:20px;cursor:pointer;font-size:15px}
.luoghi button.on{background:#111;color:#fff;border-color:#111}
.card{border:1px solid #eee;padding:16px;margin-bottom:12px;border-radius:8px}
.card b{display:block}
.btn{padding:12px 18px;font-size:16px;border:1px solid #111;border-radius:6px;background:#111;color:#fff;cursor:pointer}
.btn.chiaro{background:#fff;color:#111}
.msg{max-width:520px;position:relative}
.msg textarea{width:100%;min-height:150px;padding:14px 56px 14px 14px;font-size:16px;font-family:inherit;border:1px solid #ccc;border-radius:10px;resize:vertical}
.msg textarea:focus{outline:none;border-color:#111}
.msg .invia{position:absolute;right:10px;bottom:14px;width:38px;height:38px;border-radius:50%;border:0;background:#111;color:#fff;font-size:20px;cursor:pointer;line-height:1}
.msg .invia:disabled{background:#bbb;cursor:default}
.mailpag{margin-top:18px}
#lightbox{display:none;position:fixed;inset:0;background:#fff;z-index:40;overflow:auto;padding:16px}
#lightbox.open{display:block}
#lightbox img{max-width:100%;max-height:75vh;display:block;margin:0 auto}
#lightbox .info{max-width:700px;margin:14px auto;font-size:14px;color:#444}
#chiudi{position:fixed;top:10px;right:16px;font-size:32px;background:none;border:0;cursor:pointer}
</style>
</head>
<body>

<header>
  <button id="burger" aria-label="Menu">☰</button>
  <h1 id="nomeSito"></h1>
</header>

<nav id="menu">
  <a data-v="foto">Foto</a>
  <a data-v="attrezzatura">Attrezzatura</a>
  <a data-v="luoghi">Luoghi</a>
  <a data-v="accedi">Accedi / Registrati</a>
  <a data-v="contatti">Contatti</a>
  <a data-v="chisono">Chi sono</a>
</nav>
<div id="overlay"></div>

<main id="app"></main>

<div id="lightbox">
  <button id="chiudi">×</button>
  <img id="lbImg" alt="">
  <div class="info" id="lbInfo"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
document.title = TITOLO_PAGINA;
document.getElementById("nomeSito").textContent = NOME_SITO;

const FOTO = FOTO_FILE.map(riga => {
  const parti = riga.trim().split(/\s+/);
  const nome = parti[0];
  const home = parti.slice(1).some(p => p.toLowerCase() === "t");
  return {
    src: "foto/" + nome,
    home,
    ...FOTO_DEFAULT,
    ...(FOTO_EXTRA[nome] || {})
  };
});

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
let utente = null;

const app = document.getElementById("app");
const menu = document.getElementById("menu");
const overlay = document.getElementById("overlay");
let luogoSel = null;
let vistaCorrente = "foto";

function toggleMenu(open){
  menu.classList.toggle("open", open);
  overlay.classList.toggle("open", open);
}
document.getElementById("burger").onclick = () => toggleMenu(!menu.classList.contains("open"));
overlay.onclick = () => toggleMenu(false);
menu.querySelectorAll("a").forEach(a => a.onclick = () => { vai(a.dataset.v); toggleMenu(false); });

function griglia(lista){
  if(!lista.length) return '<p class="vuoto">Nessuna foto ancora.</p>';
  return '<div class="grid">' + lista.map(f =>
    `<img loading="lazy" src="${f.src}" alt="${f.titolo||""}" data-src="${f.src}">`).join("") + '</div>';
}
function attivaClick(lista){
  app.querySelectorAll(".grid img").forEach(img => {
    img.onclick = () => apriFoto(lista.find(f => f.src === img.dataset.src));
  });
}
function apriFoto(f){
  document.getElementById("lbImg").src = f.src;
  const righe = [];
  if(f.titolo) righe.push(`<h3>${f.titolo}</h3>`);
  if(f.luogo || f.data) righe.push(`<p>📍 ${f.luogo||""}${f.luogo&&f.data?" · ":""}${f.data||""}</p>`);
  const tech = [f.camera, f.obiettivo].filter(Boolean).join(" · ");
  const exp = [f.focale, f.apertura, f.tempo, f.iso ? "ISO "+f.iso : ""].filter(Boolean).join(" · ");
  if(tech || exp) righe.push(`<p>📷 ${tech}${tech&&exp?"<br>":""}${exp}</p>`);
  document.getElementById("lbInfo").innerHTML = righe.join("");
  document.getElementById("lightbox").classList.add("open");
}
document.getElementById("chiudi").onclick = () =>
  document.getElementById("lightbox").classList.remove("open");

function accedi(){
  auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => alert("Accesso non riuscito: " + e.message));
}
function esci(){ auth.signOut(); }

async function iscriviti(){
  try{
    await db.collection("iscritti_prova").doc(utente.uid).set({
      email: utente.email,
      nome: utente.displayName || "",
      data: firebase.firestore.FieldValue.serverTimestamp()
    });
    alert("Iscrizione completata");
  }catch(e){ alert("Errore: " + e.message); }
}

async function inviaMessaggio(){
  const area = document.getElementById("testoMsg");
  const btn = document.getElementById("bInvia");
  const testo = area.value.trim();
  if(!testo) return;
  btn.disabled = true;
  try{
    await db.collection("messaggi_prova").add({
      testo: testo.slice(0, 2000),
      email: utente ? utente.email : "",
      nome: utente ? (utente.displayName || "") : "",
      data: firebase.firestore.FieldValue.serverTimestamp()
    });
    area.value = "";
    alert("Messaggio inviato");
  }catch(e){
    alert("Errore: " + e.message);
  }
  btn.disabled = false;
}

auth.onAuthStateChanged(u => {
  utente = u;
  if(vistaCorrente === "accedi") vai("accedi");
});

function vai(v){
  vistaCorrente = v;
  if(v==="foto"){
    const lista = FOTO.filter(f => f.home);
    app.innerHTML = "<h2>Foto</h2>" + griglia(lista);
    attivaClick(lista);
  }
  else if(v==="attrezzatura"){
    const blocco = (t, arr) => arr.length
      ? `<h3 style="margin:18px 0 10px">${t}</h3>` + arr.map(x => `<div class="card"><b>${x.nome}</b>${x.note||""}</div>`).join("")
      : "";
    const html = blocco("Fotocamere", ATTREZZATURA.fotocamere) + blocco("Obiettivi", ATTREZZATURA.obiettivi);
    app.innerHTML = "<h2>Attrezzatura</h2>" + (html || '<p class="vuoto">Nulla ancora.</p>');
  }
  else if(v==="luoghi"){
    const luoghi = [...new Set(FOTO.map(f => f.luogo).filter(Boolean))].sort();
    if(!luoghi.length){ app.innerHTML = '<h2>Luoghi</h2><p class="vuoto">Nessun luogo ancora.</p>'; }
    else{
      if(!luogoSel || !luoghi.includes(luogoSel)) luogoSel = luoghi[0];
      const lista = FOTO.filter(f => f.luogo === luogoSel);
      app.innerHTML = "<h2>Luoghi</h2><div class='luoghi'>" +
        luoghi.map(l => `<button class="${l===luogoSel?'on':''}" data-l="${l}">${l}</button>`).join("") +
        "</div>" + griglia(lista);
      app.querySelectorAll(".luoghi button").forEach(b => b.onclick = () => { luogoSel = b.dataset.l; vai("luoghi"); });
      attivaClick(lista);
    }
  }
  else if(v==="accedi"){
    if(!utente){
      app.innerHTML = `<h2>Accedi o registrati</h2>
        <p style="margin-bottom:16px">Accedi con Google per ricevere un avviso quando carico nuove foto.</p>
        <button class="btn" id="bAccedi">Accedi con Google</button>`;
      document.getElementById("bAccedi").onclick = accedi;
    }else{
      app.innerHTML = `<h2>Ciao ${utente.displayName||""}</h2>
        <p style="margin-bottom:16px">${utente.email}</p>
        <button class="btn" id="bIscr">Ricevi avvisi per nuove foto</button>
        <button class="btn chiaro" id="bEsci">Esci</button>`;
      document.getElementById("bIscr").onclick = iscriviti;
      document.getElementById("bEsci").onclick = esci;
    }
  }
  else if(v==="contatti"){
    app.innerHTML = `<h2>Contatti</h2>
      <div class="msg">
        <textarea id="testoMsg" maxlength="2000" placeholder="Scrivi qui il tuo messaggio..."></textarea>
        <button class="invia" id="bInvia" aria-label="Invia">➤</button>
      </div>` +
      (CONTATTI_EMAIL ? `<p class="mailpag"><a href="mailto:${CONTATTI_EMAIL}">${CONTATTI_EMAIL}</a></p>` : "");
    document.getElementById("bInvia").onclick = inviaMessaggio;
  }
  else if(v==="chisono"){
    app.innerHTML = `<h2>Chi sono</h2><p>${CHI_SONO}</p>`;
  }
  window.scrollTo(0,0);
}
vai("foto");
</script>
</body>
</html>
